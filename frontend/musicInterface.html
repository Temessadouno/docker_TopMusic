<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MéteoPro — Musique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="musicStyle.css"/>
</head>
<body>

<!-- HEADER (identique météo) -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">TMT-<em>Pro</em></span>
    </div>
    <nav class="mode-toggle">
      <a class="mode-btn" href="./index.html">
        <span class="mode-icon">⊞</span> Dashboard
      </a>
      <a class="mode-btn" href="./index.html#graph" onclick="sessionStorage.setItem('mode','graph')">
        <span class="mode-icon">◎</span> Graphique
      </a>
      <a class="mode-btn active" href="./musicInterface.html">
        <span class="mode-icon">♫</span> Musique
      </a>
    </nav>
  </div>
</header>

<!-- SEARCH BAR (même structure que météo) -->
<section class="search-section">
  <div class="search-box">
    <input type="text" id="musicInput" placeholder="Artiste, titre, album…" autocomplete="off"
           onkeydown="if(event.key==='Enter') doSearch()"/>
    <button class="search-btn" onclick="doSearch()">
      <span>Rechercher</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
  </div>
  <div id="music-error" class="error-msg hidden">Aucun résultat trouvé. Essayez un autre terme.</div>
</section>

<!-- LAYOUT PRINCIPAL -->
<div class="music-layout">

  <!-- SIDEBAR -->
  <aside class="music-sidebar">
    <nav class="music-nav">
      <button class="music-nav-btn active" id="nav-discover" onclick="switchView('discover')">
        <span class="nav-icon">◉</span>
        <span>Découvrir</span>
      </button>
      <button class="music-nav-btn" id="nav-library" onclick="switchView('library')">
        <span class="nav-icon">◈</span>
        <span>Bibliothèque</span>
        <span class="lib-badge" id="lib-count">0</span>
      </button>
    </nav>

    <!-- Piste en cours (sidebar) -->
    <div class="now-playing-sidebar" id="now-playing-sidebar">
      <div class="np-label">En cours</div>
      <div class="np-cover" id="np-cover-side"></div>
      <div class="np-title" id="np-title-side">—</div>
      <div class="np-artist" id="np-artist-side">Sélectionne une piste</div>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <main class="music-main" id="music-main">

    <!-- VUE DÉCOUVRIR -->
    <section class="music-view active" id="view-discover">
      <h2 class="section-title" id="discover-title">
        Top Charts <span class="history-count">Deezer Global</span>
      </h2>
      <div class="track-list" id="discover-list">
        <div class="music-spinner"></div>
      </div>
    </section>

    <!-- VUE BIBLIOTHÈQUE -->
    <section class="music-view" id="view-library">
      <h2 class="section-title">
        Ma Playlist <span class="history-count" id="lib-subtitle">MongoDB</span>
      </h2>
      <div class="track-list" id="library-list">
        <div class="empty-state">Aucune musique sauvegardée.</div>
      </div>
    </section>

  </main>
</div>

<!-- PLAYER BAS DE PAGE -->
<footer class="music-player" id="music-player">

  <!-- Infos piste -->
  <div class="player-track">
    <div class="player-cover" id="player-cover"></div>
    <div class="player-meta">
      <div class="player-title" id="player-title">Aucune piste</div>
      <div class="player-artist" id="player-artist">Sélectionne une musique</div>
    </div>
    <button class="save-btn-player" id="save-btn-player" title="Sauvegarder" onclick="saveCurrentTrack()">♡</button>
  </div>

  <!-- Contrôles -->
  <div class="player-controls">
    <div class="player-btns">
      <button class="ctrl-btn" onclick="playPrev()" title="Précédent">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="play-main" id="play-btn" onclick="togglePlay()" disabled>
        <svg id="play-icon" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="ctrl-btn" onclick="playNext()" title="Suivant">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
          <path d="m6 18 8.5-6L6 6v12zm2-6 8.5 6V6z"/>
          <rect x="16" y="6" width="2" height="12"/>
        </svg>
      </button>
    </div>
    <div class="player-progress">
      <span class="time-label" id="time-cur">0:00</span>
      <div class="progress-bar" id="prog-bar" onclick="seekTo(event)">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
      <span class="time-label" id="time-dur">0:30</span>
    </div>
  </div>

  <!-- Volume + badge -->
  <div class="player-right">
    <span class="preview-badge">Aperçu 30s</span>
    <div class="vol-row">
      <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24" style="color:var(--muted); flex-shrink:0">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="0.8"
             oninput="setVolume(this.value)"/>
    </div>
  </div>

</footer>

<!-- TOAST -->
<div id="toast" class="music-toast"></div>

<audio id="audio" preload="none"></audio>
<script src="musicScript.js"></script>
</body>
</html>
